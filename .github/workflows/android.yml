name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_apk:
        description: "明确构建 Debug APK"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and compile acceptance sources
        run: >-
          ./gradlew test lintDebug
          :app:compileBenchmarkKotlin :benchmark:compileBenchmarkKotlin
          :core:database:compileDebugAndroidTestKotlin :experience:reading:compileDebugAndroidTestKotlin
          :app:writeRuntimeInventory --stacktrace
      - name: Verify additive library migrations
        run: |
          for version in 3 4 5 6 7 8; do
            ruby scripts/verify-library-migration.rb "$version" || exit 1
          done
      - name: Verify runtime notices, native hashes and fixtures
        run: python3 scripts/verify-release.py
      - name: Build APK only when explicitly requested
        if: github.event_name == 'workflow_dispatch' && inputs.build_apk
        run: ./gradlew :app:assembleDebug --stacktrace
